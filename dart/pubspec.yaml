name: vega_plugin_cubism
description: Cubism Core FFI provider and evaluated model data.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.13.5
dependencies:
  archive: ^4.0.9
  code_assets: ^2.1.0
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.5
  crypto: ^3.0.7
  ffi: ^2.2.0
flutter:
  assets:
    - assets/motion_sync/
  plugin:
    platforms:
      android:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      ios:
        ffiPlugin: true
