name: vega_plugin_cubism
description: Cubism Core FFI provider and evaluated model data.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.13.5
dependencies:
  ffi: ^2.2.0
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      ios:
        ffiPlugin: true
